<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="100%" height="210" fill="none">
  <defs>
    <linearGradient id="telemetryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f7ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070c18" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b1122" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="barPy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="barSql" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="barBi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="barJava" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="barWeb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="896" height="206" rx="12" fill="url(#bgGrad)" stroke="url(#telemetryGrad)" stroke-width="1.2"/>

  <!-- Left Column: Core Repos & Activity Metrics -->
  <g transform="translate(30, 24)">
    <text x="0" y="14" fill="#00f7ff" font-family="Consolas, monospace" font-size="11" font-weight="bold" letter-spacing="1.5">// GITHUB REPOSITORY METRICS</text>
    
    <!-- Stat Box 1: Public Repos -->
    <rect x="0" y="32" width="180" height="58" rx="8" fill="#0a1224" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="52" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Total Repositories</text>
    <text x="16" y="78" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="bold">23 Repos</text>

    <!-- Stat Box 2: Commits & Codebase -->
    <rect x="200" y="32" width="180" height="58" rx="8" fill="#0a1224" stroke="#1e293b" stroke-width="1"/>
    <text x="216" y="52" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Active Codebases</text>
    <text x="216" y="78" fill="#00f7ff" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="bold">Production &amp; Lab</text>

    <!-- Stat Box 3: Primary Focus -->
    <rect x="0" y="104" width="380" height="60" rx="8" fill="#0a1224" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="124" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Engineering Focus</text>
    <text x="16" y="148" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold">Data Analytics • Machine Learning • BI Dashboards</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="435" y1="20" x2="435" y2="190" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Right Column: Technology Distribution -->
  <g transform="translate(460, 24)">
    <text x="0" y="14" fill="#a855f7" font-family="Consolas, monospace" font-size="11" font-weight="bold" letter-spacing="1.5">// CODEBASE STACK DISTRIBUTION</text>

    <!-- Language 1: Python -->
    <text x="0" y="44" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Python (Data Science, Scikit-Learn, Pandas)</text>
    <text x="390" y="44" text-anchor="end" fill="#38bdf8" font-family="Consolas, monospace" font-size="12">52%</text>
    <rect x="0" y="52" width="390" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="52" width="202" height="8" rx="4" fill="url(#barPy)"/>

    <!-- Language 2: SQL & Power BI DAX -->
    <text x="0" y="80" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">SQL &amp; Power BI (DAX, Star-Schema, KPIs)</text>
    <text x="390" y="80" text-anchor="end" fill="#f59e0b" font-family="Consolas, monospace" font-size="12">24%</text>
    <rect x="0" y="88" width="390" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="88" width="94" height="8" rx="4" fill="url(#barSql)"/>

    <!-- Language 3: Java & Enterprise Databases -->
    <text x="0" y="116" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Java (JDBC, Desktop Architecture, MySQL)</text>
    <text x="390" y="116" text-anchor="end" fill="#f97316" font-family="Consolas, monospace" font-size="12">14%</text>
    <rect x="0" y="124" width="390" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="124" width="55" height="8" rx="4" fill="url(#barJava)"/>

    <!-- Language 4: Web & APIs -->
    <text x="0" y="152" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Web Technologies &amp; APIs (HTML5, CSS3, JS, Streamlit)</text>
    <text x="390" y="152" text-anchor="end" fill="#a855f7" font-family="Consolas, monospace" font-size="12">10%</text>
    <rect x="0" y="160" width="390" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="160" width="39" height="8" rx="4" fill="url(#barWeb)"/>
  </g>
</svg>