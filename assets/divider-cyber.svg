<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24" fill="none">
  <defs>
    <linearGradient id="cyberLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f7ff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00f7ff" stop-opacity="1" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="20" y1="12" x2="880" y2="12" stroke="url(#cyberLineGrad)" stroke-width="1.5" filter="url(#glow)" />
  <!-- Central Diamond Core -->
  <polygon points="450,6 456,12 450,18 444,12" fill="#00f7ff" filter="url(#glow)" />
  <circle cx="450" cy="12" r="1.5" fill="#ffffff" />
  <!-- Secondary Nodes -->
  <circle cx="360" cy="12" r="2.5" fill="#00f7ff" opacity="0.8" />
  <circle cx="540" cy="12" r="2.5" fill="#a855f7" opacity="0.8" />
  <circle cx="270" cy="12" r="1.5" fill="#00f7ff" opacity="0.5" />
  <circle cx="630" cy="12" r="1.5" fill="#a855f7" opacity="0.5" />
</svg>